name: Build HermesEdge Unsigned IPA (for xtool Sideloading)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'project.yml'
      - 'xtool.yml'
      - '.github/workflows/ios-unsigned-ipa.yml'

jobs:
  build-unsigned-ipa:
    name: Build Unsigned iOS .ipa on macOS 15
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen || true

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build iOS Application via xcodebuild
        run: |
          xcodebuild \
            -project HermesEdge.xcodeproj \
            -scheme HermesEdge \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee xcodebuild.log || (echo "=== XCODEBUILD ERROR ===" && tail -n 60 xcodebuild.log && exit 1)

      - name: Package Payload into HermesEdge-unsigned.ipa
        run: |
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not locate built .app bundle"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"

          mkdir -p ipa_stage/Payload
          cp -R "$APP_PATH" ipa_stage/Payload/
          cd ipa_stage
          zip -qry ../HermesEdge-unsigned.ipa Payload
          cd ..
          ls -lh HermesEdge-unsigned.ipa

      - name: Upload Unsigned IPA Artifact for xtool Sideloading
        uses: actions/upload-artifact@v4
        with:
          name: HermesEdge-unsigned-ipa
          path: HermesEdge-unsigned.ipa
          retention-days: 14
