name: Build HermesEdge Unsigned IPA (for xtool Sideloading)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'xtool.yml'
      - '.github/workflows/ios-unsigned-ipa.yml'

jobs:
  build-unsigned-ipa:
    name: Build Unsigned iOS .ipa on macOS 15
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install xtool on macOS
        run: |
          curl -fsSL https://raw.githubusercontent.com/xtool-org/xtool/main/scripts/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build Unsigned IPA via xtool
        run: |
          ~/.local/bin/xtool dev build --configuration release --ipa

      - name: Locate and Package HermesEdge-unsigned.ipa
        run: |
          IPA_PATH=$(find .build -name "*.ipa" -type f | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "Searching root directory..."
            IPA_PATH=$(find . -maxdepth 2 -name "*.ipa" -type f | head -n 1)
          fi
          if [ -n "$IPA_PATH" ]; then
            echo "Found IPA at: $IPA_PATH"
            cp "$IPA_PATH" HermesEdge-unsigned.ipa
          else
            echo "Error: Could not locate built .ipa file"
            exit 1
          fi

      - name: Upload Unsigned IPA Artifact for xtool Sideloading
        uses: actions/upload-artifact@v4
        with:
          name: HermesEdge-unsigned-ipa
          path: HermesEdge-unsigned.ipa
          retention-days: 14
