name: Build HermesEdge Unsigned IPA (for xtool Sideloading)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'xtool.yml'
      - '.github/workflows/ios-unsigned-ipa.yml'

jobs:
  build-unsigned-ipa:
    name: Build Unsigned iOS .ipa on macOS 15
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Build Unsigned iOS Binary via SwiftPM
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using iOS SDK at: $SDK_PATH"
          swift build -c release --triple arm64-apple-ios18.0 --sdk "$SDK_PATH"

      - name: Package Payload into HermesEdge-unsigned.ipa
        run: |
          find .build -name "HermesEdgeApp" -type f -ls
          APP_BIN=$(find .build -name "HermesEdgeApp" -type f -perm +111 | grep -v '\.dSYM' | head -n 1)
          if [ -z "$APP_BIN" ]; then
            echo "Error: Could not locate compiled HermesEdgeApp executable"
            exit 1
          fi
          echo "Found binary at: $APP_BIN"

          mkdir -p build_stage/HermesEdge.app
          cp "$APP_BIN" build_stage/HermesEdge.app/HermesEdgeApp
          cp Sources/HermesEdgeApp/Info.plist build_stage/HermesEdge.app/Info.plist

          mkdir -p ipa_stage/Payload
          cp -R build_stage/HermesEdge.app ipa_stage/Payload/
          cd ipa_stage
          zip -qry ../HermesEdge-unsigned.ipa Payload
          cd ..
          ls -lh HermesEdge-unsigned.ipa

      - name: Upload Unsigned IPA Artifact for xtool Sideloading
        uses: actions/upload-artifact@v4
        with:
          name: HermesEdge-unsigned-ipa
          path: HermesEdge-unsigned.ipa
          retention-days: 14
