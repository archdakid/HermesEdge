name: Build HermesEdge Unsigned IPA (for xtool Sideloading)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'xtool.yml'
      - '.github/workflows/ios-unsigned-ipa.yml'

jobs:
  build-unsigned-ipa:
    name: Build Unsigned iOS .ipa on macOS 15
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install xtool on macOS
        run: |
          curl -sL https://github.com/xtool-org/xtool/releases/download/1.22.2/xtool.app.zip -o xtool.app.zip
          unzip -q xtool.app.zip
          sudo cp -R xtool.app /Applications/
          sudo ln -s /Applications/xtool.app/Contents/MacOS/xtool /usr/local/bin/xtool
          xtool --version

      - name: Build Unsigned IPA via xtool
        run: |
          xtool dev build --configuration release --ipa

      - name: Locate and Package HermesEdge-unsigned.ipa
        run: |
          find . -name "*.ipa" -ls
          IPA_PATH=$(find . -name "*.ipa" -type f | head -n 1)
          if [ -n "$IPA_PATH" ]; then
            echo "Found IPA at: $IPA_PATH"
            cp "$IPA_PATH" HermesEdge-unsigned.ipa
          else
            echo "Error: Could not locate built .ipa file"
            exit 1
          fi

      - name: Upload Unsigned IPA Artifact for xtool Sideloading
        uses: actions/upload-artifact@v4
        with:
          name: HermesEdge-unsigned-ipa
          path: HermesEdge-unsigned.ipa
          retention-days: 14
