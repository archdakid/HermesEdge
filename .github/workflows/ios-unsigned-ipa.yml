name: Build HermesEdge Unsigned IPA (for xtool Sideloading)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'project.yml'
      - 'xtool.yml'
      - 'Info.plist'
      - '.github/workflows/ios-unsigned-ipa.yml'

jobs:
  build-unsigned-ipa:
    name: Build Unsigned iOS .ipa on macOS 15
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          for xc in /Applications/Xcode_16.2.app /Applications/Xcode_16.1.app /Applications/Xcode.app; do
            if [ -d "$xc" ]; then
              echo "Selecting $xc..."
              sudo xcode-select -s "$xc"
              sudo xcodebuild -runFirstLaunch || true
              break
            fi
          done
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen || true

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build iOS Application via xcodebuild
        run: |
          set -o pipefail
          build_cmd() {
            xcodebuild \
              -project HermesEdge.xcodeproj \
              -scheme HermesEdge \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -configuration Release \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee xcodebuild.log
          }

          if build_cmd; then
            echo "Build succeeded on first attempt!"
          else
            echo "Build failed. Checking for alternative Xcode or missing platform..."
            for alt_xc in /Applications/Xcode_16.2.app /Applications/Xcode_16.1.app /Applications/Xcode.app; do
              if [ -d "$alt_xc" ]; then
                echo "Switching to $alt_xc..."
                sudo xcode-select -s "$alt_xc"
                sudo xcodebuild -runFirstLaunch || true
                if build_cmd; then
                  echo "Build succeeded with $alt_xc!"
                  exit 0
                fi
              fi
            done
            echo "Attempting -downloadPlatform iOS as final fallback..."
            sudo xcodebuild -downloadPlatform iOS || true
            sudo xcodebuild -runFirstLaunch || true
            build_cmd
          fi

      - name: Package Payload into HermesEdge-unsigned.ipa
        run: |
          APP_PATH=$(find build/Build/Products -name "HermesEdge.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not locate built HermesEdge.app bundle"
            find build -maxdepth 5
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          ls -la "$APP_PATH"
          if [ ! -f "$APP_PATH/HermesEdge" ]; then
            echo "Error: HermesEdge binary not found in $APP_PATH"
            exit 1
          fi

          mkdir -p ipa_stage/Payload
          cp -R "$APP_PATH" ipa_stage/Payload/

          echo "=== Merging privacy keys from Info.plist into packaged app bundle ==="
          python3 scripts/merge-plist.py Info.plist ipa_stage/Payload/HermesEdge.app/Info.plist

          echo "=== Verifying packaged Info.plist contents ==="
          cat "ipa_stage/Payload/HermesEdge.app/Info.plist"

          cd ipa_stage
          zip -qry ../HermesEdge-unsigned.ipa Payload
          cd ..
          ls -lh HermesEdge-unsigned.ipa

      - name: Upload Unsigned IPA Artifact for xtool Sideloading
        uses: actions/upload-artifact@v4
        with:
          name: HermesEdge-unsigned-ipa
          path: HermesEdge-unsigned.ipa
          retention-days: 14
