name: HermesEdge
options:
  bundleIdPrefix: com.quincearch
  deploymentTarget:
    iOS: "18.0"
packages:
  LlamaSwift:
    url: https://github.com/mattt/llama.swift
    exactVersion: 2.10549.0
targets:
  HermesEdge:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/HermesEdgeApp
      - path: Sources/HermesEdgeCore
    dependencies:
      - package: LlamaSwift
        product: LlamaSwift
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quincearch.HermesEdge
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSRemindersUsageDescription: "Hermes needs access to Reminders to create and manage reminders on your behalf."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Hermes needs full access to Reminders to create, organize, and check your tasks offline."
        INFOPLIST_KEY_NSCalendarsUsageDescription: "Hermes needs access to Calendar to check and schedule your appointments."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Hermes needs full access to Calendar to check, plan, and schedule your appointments offline."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Hermes needs microphone access for voice input and hands-free assistant conversations."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Hermes uses speech recognition to transcribe your voice commands completely offline on your iPhone."
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        AD_HOC_CODE_SIGNING_ALLOWED: YES
        SWIFT_VERSION: "6.0"
        OTHER_LDFLAGS:
          - "-framework"
          - "Metal"
          - "-framework"
          - "MetalKit"
          - "-framework"
          - "Accelerate"
