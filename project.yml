name: HermesEdge
options:
  bundleIdPrefix: com.quincearch
  deploymentTarget:
    iOS: "18.0"
packages:
  LlamaSwift:
    url: https://github.com/mattt/llama.swift
    exactVersion: 2.10549.0
targets:
  HermesEdge:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/HermesEdgeApp
      - path: Sources/HermesEdgeCore
    dependencies:
      - package: LlamaSwift
        product: LlamaSwift
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quincearch.HermesEdge
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: HermesEdge.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        AD_HOC_CODE_SIGNING_ALLOWED: YES
        SWIFT_VERSION: "6.0"
        OTHER_LDFLAGS:
          - "-framework"
          - "Metal"
          - "-framework"
          - "MetalKit"
          - "-framework"
          - "Accelerate"
